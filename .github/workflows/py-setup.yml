name: Language Server Environment Setup
on:
  workflow_call:

jobs:
  language-server-env:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.20"
          enable-cache: true

      - name: Update uv.lock (if needed)
        run: uv lock

      - name: Install the project
        run: uv sync --locked --all-extras --dev
